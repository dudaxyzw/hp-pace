<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Human Pace</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela inicial: a equipe toca "Iniciar" antes de prender o tablet no colete -->
  <section id="start" class="screen">
    <h1>HUMAN PACE</h1>
    <button id="btn-start">INICIAR</button>
    <p id="start-msg" class="hint">Permita o acesso à localização quando o navegador pedir.</p>
  </section>

  <!-- Tela de corrida -->
  <section id="run" class="screen hidden">
    <div id="gps-status" class="status"><span class="dot"></span><span id="gps-text">buscando GPS</span></div>

    <div class="pace-wrap">
      <div class="pace">
        <span class="ghost">88:88</span>
        <span id="pace">--:--</span>
      </div>
      <div class="unit">MIN/KM</div>
    </div>

    <div class="distance"><span id="distance">0.00</span> KM</div>

    <div id="stop-progress"></div>

    <!-- Painel de diagnóstico: toque duplo para abrir/fechar -->
    <pre id="diag" class="hidden"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
